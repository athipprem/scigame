<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="sq-auth.js"></script>
<title>Science Quest — Reset Password</title>
<style>
  :root{
    --bg:#0a1128; --bg2:#16213e; --panel:#11192f; --line:#2a3a5c;
    --ink:#fff8e6; --grey:#a9b8d9; --gold:#FFD700; --amber:#FFA500;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:radial-gradient(circle at 50% -10%,var(--bg2),var(--bg));color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:var(--panel);border:1.5px solid var(--line);border-radius:18px;padding:28px 26px;max-width:380px;width:100%}
  h1{font-size:1.3rem;margin:0 0 6px;background:linear-gradient(135deg,var(--gold),var(--amber));-webkit-background-clip:text;background-clip:text;color:transparent}
  p.sub{color:var(--grey);font-size:.82rem;margin:0 0 20px;line-height:1.5}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:.75rem;color:var(--grey);margin-bottom:5px;font-weight:700}
  .field input{width:100%;box-sizing:border-box;background:#1c1642;border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--ink);font-size:.9rem}
  .field input:focus{outline:none;border-color:var(--gold)}
  .hint{font-size:.7rem;color:var(--grey);margin-top:5px;line-height:1.4}
  .pwd-wrap{position:relative}
  .pwd-wrap input{padding-right:38px}
  .eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--grey);cursor:pointer;padding:6px;display:flex;align-items:center;justify-content:center;border-radius:6px}
  .eye:hover{color:var(--gold)}
  .btn{display:block;width:100%;border:none;border-radius:12px;padding:11px;font-weight:800;font-size:.88rem;cursor:pointer;background:linear-gradient(135deg,var(--gold),var(--amber));color:#3a2a00;margin-top:6px}
  .btn:disabled{opacity:.6;cursor:default}
  .status{font-size:.8rem;text-align:center;margin-top:12px;min-height:16px;color:var(--grey)}
  .status.err{color:#ff8a80}
  .status.ok{color:#43e97b}
  .link{display:inline-block;margin-top:14px;color:var(--gold);font-size:.8rem;text-decoration:none;font-weight:700}
</style>
</head>
<body>
  <div class="card" id="card">
    <h1>Reset your password</h1>
    <p class="sub" id="intro">Checking your reset link...</p>
    <div id="form-area"></div>
  </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const EYE_ICON = `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5Z"/><circle cx="8" cy="8" r="2.2"/></svg>`;
  const EYE_OFF_ICON = `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5Z"/><circle cx="8" cy="8" r="2.2"/><line x1="1" y1="1" x2="15" y2="15"/></svg>`;
  function wireEye(eyeId, inputId){
    const btn = document.getElementById(eyeId), input = document.getElementById(inputId);
    btn.onclick = () => {
      const showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      btn.innerHTML = showing ? EYE_ICON : EYE_OFF_ICON;
    };
  }

  function showForm(){
    document.getElementById('intro').textContent = "You're verified — set a new password below.";
    document.getElementById('form-area').innerHTML = `
      <div class="field">
        <label>New Password</label>
        <div class="pwd-wrap">
          <input type="password" id="pwd-new" placeholder="Create a new password" autocomplete="new-password">
          <button type="button" class="eye" id="eye-new">${EYE_ICON}</button>
        </div>
        <div class="hint">Must be 8+ characters with uppercase, lowercase, a number, and a symbol (e.g. !@#$%).</div>
      </div>
      <div class="field">
        <label>Confirm New Password</label>
        <div class="pwd-wrap">
          <input type="password" id="pwd-confirm" placeholder="Re-enter your new password" autocomplete="new-password">
          <button type="button" class="eye" id="eye-confirm">${EYE_ICON}</button>
        </div>
      </div>
      <button class="btn" id="save-btn">Set New Password</button>
      <div class="status" id="status"></div>
    `;
    wireEye('eye-new', 'pwd-new');
    wireEye('eye-confirm', 'pwd-confirm');
    document.getElementById('save-btn').onclick = async () => {
      const next = document.getElementById('pwd-new').value;
      const confirm = document.getElementById('pwd-confirm').value;
      const statusEl = document.getElementById('status');
      const btn = document.getElementById('save-btn');
      statusEl.className = 'status';
      if (!next || !confirm){ statusEl.textContent = 'Fill in both password fields.'; statusEl.className = 'status err'; return; }
      if (next !== confirm){ statusEl.textContent = "Passwords don't match — check both fields."; statusEl.className = 'status err'; return; }
      btn.disabled = true; statusEl.textContent = 'Saving...';
      const { error } = await SQAuth.client.auth.updateUser({ password: next });
      if (error){
        statusEl.textContent = error.message; statusEl.className = 'status err'; btn.disabled = false;
      } else {
        statusEl.textContent = 'Password updated! Redirecting...'; statusEl.className = 'status ok';
        setTimeout(() => { location.href = 'index.html'; }, 1500);
      }
    };
  }

  function showExpired(){
    document.getElementById('intro').textContent = "This link has expired or was already used.";
    document.getElementById('form-area').innerHTML = `
      <a class="link" id="retry">Request a new reset link</a><br>
      <a class="link" href="index.html">&larr; Back to World Map</a>
    `;
    document.getElementById('retry').onclick = () => SQAuth.openAuth('forgot');
  }

  function boot(){
    if (!SQAuth.ready){ setTimeout(boot, 80); return; }
    if (SQAuth.user){ showForm(); }
    else { showExpired(); }
  }
  boot();
});
</script>
</body>
</html>
